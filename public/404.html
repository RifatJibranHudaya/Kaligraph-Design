<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan | Kafa Advertising</title>
    <meta name="description" content="Maaf, halaman yang Anda cari tidak ditemukan. Kembali ke beranda Kafa Advertising.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a1317 0%, #1a2730 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
        }
        
        .error-code {
            font-size: 120px;
            font-weight: 800;
            background: linear-gradient(135deg, #0091ff 0%, #0064e0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 20px;
        }
        
        .error-title {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #f1f4f7;
        }
        
        .error-message {
            font-size: 16px;
            color: #8595a4;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        
        .search-form {
            margin-bottom: 32px;
        }
        
        .search-input {
            width: 100%;
            max-width: 400px;
            padding: 14px 24px;
            border: 2px solid #243542;
            border-radius: 50px;
            background: #141f26;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .search-input:focus {
            border-color: #0091ff;
        }
        
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            background: #0064e0;
            color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.2s;
        }
        
        .btn-home:hover {
            background: #0457cb;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 100, 224, 0.4);
        }
        
        .quick-links {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid #243542;
        }
        
        .quick-links h3 {
            font-size: 14px;
            font-weight: 600;
            color: #5d6c7b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }
        
        .quick-links a {
            display: inline-block;
            margin: 0 12px 8px;
            color: #dee3e9;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        
        .quick-links a:hover {
            color: #0091ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1 class="error-title">Halaman Tidak Ditemukan</h1>
        <p class="error-message">
            Maaf, halaman yang Anda cari tidak dapat ditemukan. 
            Mungkin halaman telah dipindahkan atau dihapus.
        </p>
        
        <form class="search-form" action="/" method="GET">
            <input type="text" class="search-input" placeholder="Cari produk atau layanan..." name="q">
        </form>
        
        <a href="/" class="btn-home">
            ← Kembali ke Beranda
        </a>
        
        <div class="quick-links">
            <h3>Halaman Populer</h3>
            <a href="/katalog">Katalog Produk</a>
            <a href="/portofolio">Portfolio</a>
            <a href="/login">Login</a>
            <a href="https://wa.me/6281234567890">Hubungi WhatsApp</a>
        </div>
    </div>
    
    <script>
        // Redirect to homepage after 60 seconds
        setTimeout(() => {
            window.location.href = '/';
        }, 60000);
    </script>
</body>
</html>
